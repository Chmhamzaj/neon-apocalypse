name: React 3D Game Build

on:
  push:
    branches: [main]
    paths:
      - "react-game/**"
      - ".github/workflows/react-game.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: StreetSovereign-React-3D
          path: react-game/dist
