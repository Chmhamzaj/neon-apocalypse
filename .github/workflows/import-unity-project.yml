name: Import NEON APOCALYPSE Unity Project

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag containing the Unity project ZIP"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Unity project ZIP from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          rm -rf import_tmp
          mkdir -p import_tmp
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir import_tmp \
            --clobber
          ZIP_FILE="$(find import_tmp -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract and locate Unity project
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_ROOT="$(find extracted -type d -name Assets -print -quit | xargs -r dirname)"
          if [ -z "${PROJECT_ROOT:-}" ] || [ ! -d "$PROJECT_ROOT/ProjectSettings" ]; then
            echo "Could not locate a valid Unity project containing Assets and ProjectSettings."
            find extracted -maxdepth 4 -type d | sort | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected Unity project at: $PROJECT_ROOT"

      - name: Replace repository contents with Unity project
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          cp -a "$PROJECT_ROOT"/. .

          rm -rf import_tmp extracted

          echo "Imported Unity project:"
          test -d Assets
          test -d ProjectSettings
          test -f ProjectSettings/ProjectVersion.txt
          find . -maxdepth 2 -type d | sort | head -100

      - name: Commit imported project
        run: |
          set -euo pipefail
          git config user.name "NEON APOCALYPSE Cloud Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import NEON APOCALYPSE Unity project"
          git push
