name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android-game
          sparse-checkout-cone-mode: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate hosted Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          ls -la "$ANDROID_HOME/platforms" | tail -20
          ls -la "$ANDROID_HOME/build-tools" | tail -20

      - name: Build debug APK
        working-directory: android-game
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android-game/app/build/outputs/apk/debug/app-debug.apk dist/StreetSovereign-Hamza.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreetSovereign-Hamza-APK
          path: dist/StreetSovereign-Hamza.apk
          if-no-files-found: error
