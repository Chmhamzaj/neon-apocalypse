name: Build Street Sovereign 3D APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -q Godot_v4.5-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Export APK
        run: |
          mkdir -p dist
          godot --headless --path godot-game --editor --quit
          godot --headless --path godot-game --export-debug "Android" dist/StreetSovereign-3D-Hamza.apk
      - name: Upload 3D APK
        uses: actions/upload-artifact@v4
        with:
          name: StreetSovereign-3D-Hamza-APK
          path: dist/StreetSovereign-3D-Hamza.apk
