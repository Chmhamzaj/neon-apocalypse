name: Build Street Sovereign 3D APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -q Godot_v4.5-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Export APK
        run: |
          mkdir -p godot-game/dist
          keytool -genkeypair -v -keystore /tmp/street-sovereign-debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/street-sovereign-debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path godot-game --editor --quit
          godot --headless --path godot-game --export-debug "Android" dist/StreetSovereign-3D-Hamza-unsigned.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner sign --ks /tmp/street-sovereign-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out godot-game/dist/StreetSovereign-3D-Hamza.apk godot-game/dist/StreetSovereign-3D-Hamza-unsigned.apk
      - name: Android runtime debug test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eux
            adb install -r godot-game/dist/StreetSovereign-3D-Hamza.apk
            adb shell am force-stop com.hamza.streetsovereign3d
            adb shell monkey -p com.hamza.streetsovereign3d 1
            sleep 12
            adb shell screencap -p /sdcard/streetsovereign-debug.png
            adb pull /sdcard/streetsovereign-debug.png godot-game/dist/streetsovereign-debug.png
            adb logcat -d -v time > godot-game/dist/streetsovereign-logcat.txt
            if grep -Eiq "FATAL EXCEPTION|SIGSEGV|signal 11|Godot Engine:.*ERROR|SCRIPT ERROR|Parse Error" godot-game/dist/streetsovereign-logcat.txt; then
              echo "RUNTIME DEBUG FAILURE DETECTED"
              grep -Ei "FATAL EXCEPTION|SIGSEGV|signal 11|Godot Engine:.*ERROR|SCRIPT ERROR|Parse Error" godot-game/dist/streetsovereign-logcat.txt || true
              exit 1
            fi
            adb shell pidof com.hamza.streetsovereign3d
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreetSovereign-runtime-debug
          path: |
            godot-game/dist/streetsovereign-debug.png
            godot-game/dist/streetsovereign-logcat.txt
      - name: Upload 3D APK
        uses: actions/upload-artifact@v4
        with:
          name: StreetSovereign-3D-Hamza-APK
          path: godot-game/dist/StreetSovereign-3D-Hamza.apk
