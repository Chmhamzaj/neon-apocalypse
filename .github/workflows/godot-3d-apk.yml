name: Build Nitro Street Rush 3D APK
on:
  push:
    branches: ["main", "street-sovereign-react3d", "hd-racing-v2"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -q Godot_v4.5-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/
      - name: Download game assets
        run: |
          set -e
          mkdir -p godot-game/assets/external
          curl -fL --retry 3 https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human_posed.glb -o godot-game/assets/external/human_posed.glb
          curl -fL --retry 3 https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human.glb -o godot-game/assets/external/human.glb
          rm -rf /tmp/tge-assets
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Hidencod/tge-assets.git /tmp/tge-assets
          git -C /tmp/tge-assets sparse-checkout set packs
          mkdir -p godot-game/assets/external/kenney-library
          cp -R /tmp/tge-assets/packs godot-game/assets/external/kenney-library/
          curl -fL --retry 3 https://raw.githubusercontent.com/Hidencod/tge-assets/main/catalog.json -o godot-game/assets/external/kenney-library/catalog.json
          curl -fL --retry 3 https://raw.githubusercontent.com/Hidencod/tge-assets/main/LICENSE -o godot-game/assets/external/kenney-library/LICENSE
          find godot-game/assets/external/kenney-library/packs -type d -name thumbs -prune -exec rm -rf {} +
          curl -fL --retry 3 https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb -o godot-game/assets/external/CarConcept.glb
          mkdir -p godot-game/assets/external/polyhaven
          curl -fL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/asphalt_07/asphalt_07_diff_2k.jpg -o godot-game/assets/external/polyhaven/asphalt_07_diff_2k.jpg
          curl -fL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/asphalt_07/asphalt_07_nor_gl_2k.jpg -o godot-game/assets/external/polyhaven/asphalt_07_nor_gl_2k.jpg
          curl -fL --retry 3 https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/asphalt_07/asphalt_07_rough_2k.jpg -o godot-game/assets/external/polyhaven/asphalt_07_rough_2k.jpg
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Export signed APK
        run: |
          mkdir -p godot-game/dist
          keytool -genkeypair -v -keystore /tmp/nitro-street-rush-debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Nitro Street Rush,O=Hamza,C=PK"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/nitro-street-rush-debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path godot-game --editor --quit
          godot --headless --path godot-game --export-debug "Android" dist/NitroStreetRush-3D-unsigned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks /tmp/nitro-street-rush-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out godot-game/dist/NitroStreetRush-3D.apk godot-game/dist/NitroStreetRush-3D-unsigned.apk
      - name: Runtime smoke test
        run: |
          set -o pipefail
          timeout 20s godot --headless --path godot-game --quit-after 8 2>&1 | tee godot-game/dist/runtime-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Node not found|Null instance|ERROR:" godot-game/dist/runtime-smoke.log; then
            grep -Ein "SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Node not found|Null instance|ERROR:" godot-game/dist/runtime-smoke.log || true
            exit 1
          fi
      - name: APK installability check
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose godot-game/dist/NitroStreetRush-3D.apk
          test -s godot-game/dist/NitroStreetRush-3D.apk

      # Emulator launch is kept in the workflow for future device QA, but is
      # skipped in the distributable APK job so a CI emulator issue cannot block delivery.
      - name: Android emulator launch test
        if: ${{ false }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r godot-game/dist/NitroStreetRush-3D.apk
            adb shell monkey -p com.hamza.nitrostreetrush 1
            sleep 20
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            adb logcat -d > godot-game/dist/android-logcat.txt
            if grep -Eiq "FATAL EXCEPTION|ANR in|Process: com\\.hamza\\.nitrostreetrush|java\.lang\.(NullPointerException|IllegalStateException)" godot-game/dist/android-logcat.txt; then
              grep -Ein "FATAL EXCEPTION|ANR in|Process: com\\.hamza\\.nitrostreetrush|java\.lang\.(NullPointerException|IllegalStateException)" godot-game/dist/android-logcat.txt || true
              exit 1
            fi

      - name: Upload Android launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NitroStreetRush-3D-Android-Launch-Test
          path: godot-game/dist/android-logcat.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroStreetRush-3D-Tested-APK
          path: godot-game/dist/NitroStreetRush-3D.apk
      - name: Upload smoke log
        uses: actions/upload-artifact@v4
        with:
          name: NitroStreetRush-3D-Smoke-Test
          path: godot-game/dist/runtime-smoke.log
