name: Nitro Street Rush HD - Unity Android

on:
  workflow_dispatch:
  push:
    branches: [hd-racing-v2]
    paths:
      - 'unity-hd/**'
      - '.github/workflows/unity-hd-android.yml'

jobs:
  build-android:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity-hd
          unityVersion: 6000.2.0f1
          targetPlatform: Android
          buildMethod: NitroStreetRush.Editor.BuildAndroid.Build
          versioning: Semantic
          androidExportType: androidPackage
          customParameters: '-nographics'
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroStreetRush-HD-Android
          path: unity-hd/Builds/NitroStreetRush-HD.apk
          if-no-files-found: error
