name: Nitro Street Rush HD - Unity Android

on:
  workflow_dispatch:
  push:
    branches: [hd-racing-v2]
    paths:
      - 'unity-hd/**'
      - '.github/workflows/unity-hd-android.yml'

jobs:
  build-android:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-hd/Library
          key: Library-unity-hd-Android-${{ hashFiles('unity-hd/Assets/**','unity-hd/Packages/**','unity-hd/ProjectSettings/**') }}
          restore-keys: |
            Library-unity-hd-Android-
            Library-unity-hd-
            Library-

      - name: Free disk space for Android build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity-hd
          unityVersion: 6000.2.0f1
          targetPlatform: Android
          buildMethod: NitroStreetRush.Editor.BuildAndroid.Build
          versioning: Semantic
          androidExportType: androidPackage
          allowDirtyBuild: true
          customParameters: '-nographics'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NitroStreetRush-HD-Android
          path: unity-hd/Builds/NitroStreetRush-HD.apk
          if-no-files-found: error